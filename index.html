<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hassy">
<link rel="manifest" href="./manifest.webmanifest">
<title>Hassy Natural</title>
<style>
:root{--bg:#0b0b0b;--panel:#171717;--line:#303030;--text:#f4f1eb;--muted:#aaa59b;--cream:#eee4d3}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;min-height:100%}
body{min-height:100vh}.app{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 15px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}.brand{font-size:11px;letter-spacing:.25em;color:var(--muted);font-weight:700}h1{margin:3px 0;font-size:32px;letter-spacing:-.04em}
.hero{height:40vh;min-height:300px;border:1px solid #292929;border-radius:28px;padding:24px;display:flex;align-items:flex-end;background:linear-gradient(155deg,#2b261f,#171717 58%,#101010)}
.hero h2{font-size:34px;line-height:1.03;letter-spacing:-.045em;margin:12px 0}.hero p,.small{color:var(--muted);line-height:1.5}.pill{font-size:12px;border:1px solid #414141;padding:7px 10px;border-radius:999px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.card{min-height:145px;border-radius:23px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}.camera{background:var(--cream);color:#111}.import{background:var(--panel);border:1px solid var(--line)}.ico{font-size:27px;margin-bottom:auto}.title{font-size:21px;font-weight:700}.sub{font-size:13px;opacity:.65;margin-top:3px}.note{text-align:center;color:#726e68;font-size:12px;margin:16px}
input[type=file]{display:none}.editor{display:none}.editor.active{display:block}.home.hidden{display:none}.bar{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}.btn{border:0;background:none;color:#c7c0b6;padding:10px;font-size:14px}.save{font-weight:700;color:#fff}.count{font-size:13px;color:#807b73}
.preview{position:relative;border:1px solid #222;background:#050505;border-radius:24px;overflow:hidden;min-height:45vh;display:grid;place-items:center;touch-action:none}.preview canvas{max-width:100%;max-height:58vh;width:auto;height:auto}.badge{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);font-size:11px;background:#000a;border:1px solid #ffffff1f;padding:8px 11px;border-radius:99px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:11px 0}.thumb{width:58px;height:58px;flex:0 0 58px;border:2px solid transparent;border-radius:12px;padding:0;overflow:hidden;background:#222}.thumb.active{border-color:#eadfce}.thumb img{width:100%;height:100%;object-fit:cover}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:23px;padding:18px}.row{display:flex;justify-content:space-between;align-items:center}.label{font-size:18px;font-weight:700}.desc{font-size:12px;color:var(--muted);margin-top:3px}.value{font-size:13px;color:#d5cdc1}input[type=range]{width:100%;margin:20px 0;accent-color:#e7dfd2}.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:8px}.soft{border:1px solid #363636;background:#242424;color:#ddd;padding:12px;border-radius:14px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,15px);opacity:0;transition:.2s;background:#eee4d3;color:#111;font-weight:600;font-size:13px;padding:10px 14px;border-radius:99px}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:430px){.hero{min-height:285px}.hero h2{font-size:31px}.card{min-height:137px}}
</style>
</head>
<body><main class="app">
<header><div><div class="brand">HASSY</div><h1>Natural</h1></div></header>
<section id="home" class="home">
<div class="hero"><div><span class="pill">Natural colour</span><h2>Quiet colour. Smooth highlights. No filter look.</h2><p>Capture a new photo or process a batch from your library.</p></div></div>
<div class="actions">
<label class="card camera" for="camera"><span class="ico">◎</span><span class="title">Camera</span><span class="sub">Take a photo</span></label>
<label class="card import" for="library"><span class="ico">▦</span><span class="title">Import</span><span class="sub">Select photos</span></label>
</div>
<input id="camera" type="file" accept="image/*" capture="environment"><input id="library" type="file" accept="image/*" multiple>
<div class="note">Originals are never overwritten. Processing happens locally on your device.</div>
</section>
<section id="editor" class="editor">
<div class="bar"><button class="btn" id="back">Back</button><span class="count" id="count"></span><button class="btn save" id="save">Save</button></div>
<div class="preview" id="preview"><canvas id="canvas"></canvas><div class="badge">Hold for original</div></div>
<div class="strip" id="strip"></div>
<div class="controls"><div class="row"><div><div class="label">Natural</div><div class="desc">Hasselblad-inspired natural colour</div></div><div class="value" id="val">100</div></div>
<input id="intensity" type="range" min="0" max="100" value="100"><div class="twobtn"><button class="soft" id="compare">Show original</button><button class="soft" id="reset">Reset</button></div></div>
</section>
</main><div class="toast" id="toast"></div>
<script>
const q=id=>document.getElementById(id), S={items:[],active:0,intensity:100,original:false};
const home=q('home'),editor=q('editor'),canvas=q('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),strip=q('strip'),toast=q('toast');
const clamp=x=>Math.max(0,Math.min(1,x)), smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const lin=v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)}, srgb=v=>{v=clamp(v);return(v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055)*255};
function natural(r8,g8,b8,k){let r=lin(r8),g=lin(g8),b=lin(b8),or=r,og=g,ob=b;
let nr=1.018*r+.004*g-.010*b,ng=-.006*r+1.010*g-.002*b,nb=-.004*r+.006*g+.985*b;r=nr;g=ng;b=nb;
let y=.2126*r+.7152*g+.0722*b,toe=y<.18?y*(.985+.07*(.18-y)/.18):y,sh=toe>.58?.58+(toe-.58)/(1+.72*(toe-.58)):toe,y2=clamp(sh*1.015+.003),sc=y>1e-5?y2/y:1;r*=sc;g*=sc;b*=sc;
y=.2126*r+.7152*g+.0722*b;let cr=r-y,cg=g-y,cb=b-y,ch=Math.sqrt(cr*cr+cg*cg+cb*cb),hi=smooth(.55,.95,y),sat=(.985-.10*hi)/(1+.32*Math.max(0,ch-.18));r=y+cr*sat;g=y+cg*sat;b=y+cb*sat;
let gd=clamp((g-Math.max(r,b))*3);g-=.012*gd;r+=.004*gd;let bd=clamp((b-Math.max(r,g))*2.7);b-=.010*bd;r+=.003*bd;let mid=Math.exp(-Math.pow((y-.42)/.28,2));r+=.006*mid;b-=.0035*mid;
r=or+(r-or)*k;g=og+(g-og)*k;b=ob+(b-ob)*k;return[srgb(r),srgb(g),srgb(b)]}
function process(d,k){for(let i=0;i<d.data.length;i+=4){let p=natural(d.data[i],d.data[i+1],d.data[i+2],k);d.data[i]=p[0];d.data[i+1]=p[1];d.data[i+2]=p[2]}return d}
function msg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>toast.classList.remove('show'),1700)}
async function bitmap(f){try{return await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){return await new Promise((ok,no)=>{let i=new Image;i.onload=()=>{URL.revokeObjectURL(i.src);ok(i)};i.onerror=no;i.src=URL.createObjectURL(f)})}}
function fit(w,h,mw,mh){let s=Math.min(mw/w,mh/h,1);return[Math.max(1,Math.round(w*s)),Math.max(1,Math.round(h*s))]}
async function load(list){let files=[...list].filter(f=>f.type.startsWith('image/')).slice(0,100);if(!files.length)return;S.items=[];S.active=0;S.intensity=100;q('intensity').value=100;q('val').textContent=100;home.classList.add('hidden');editor.classList.add('active');q('count').textContent='Loading…';
for(let f of files){try{S.items.push({file:f,bmp:await bitmap(f)})}catch(e){}}if(!S.items.length){msg('Could not read images');return}q('count').textContent=S.items.length+' photo'+(S.items.length>1?'s':'');buildStrip();render()}
function thumb(it){let c=document.createElement('canvas');c.width=c.height=120;let x=c.getContext('2d'),s=Math.max(120/it.bmp.width,120/it.bmp.height),w=it.bmp.width*s,h=it.bmp.height*s;x.drawImage(it.bmp,(120-w)/2,(120-h)/2,w,h);return c.toDataURL('image/jpeg',.75)}
function buildStrip(){strip.innerHTML='';S.items.forEach((it,i)=>{let b=document.createElement('button');b.className='thumb'+(i===0?' active':'');let im=new Image;im.src=thumb(it);b.append(im);b.onclick=()=>{S.active=i;S.original=false;render()};strip.append(b)})}
function render(){let it=S.items[S.active];if(!it)return;let z=fit(it.bmp.width,it.bmp.height,Math.min(innerWidth*2,1400),1200);canvas.width=z[0];canvas.height=z[1];ctx.drawImage(it.bmp,0,0,z[0],z[1]);if(!S.original&&S.intensity){let d=ctx.getImageData(0,0,z[0],z[1]);ctx.putImageData(process(d,S.intensity/100),0,0)}[...strip.children].forEach((e,i)=>e.classList.toggle('active',i===S.active))}
async function full(it){let z=fit(it.bmp.width,it.bmp.height,4600,4600),c=document.createElement('canvas');c.width=z[0];c.height=z[1];let x=c.getContext('2d',{willReadFrequently:true});x.drawImage(it.bmp,0,0,z[0],z[1]);let d=x.getImageData(0,0,z[0],z[1]);x.putImageData(process(d,S.intensity/100),0,0);return c}
const blob=c=>new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('encode')),'image/jpeg',.94));
async function save(){try{if(S.items.length===1){msg('Rendering…');let it=S.items[0],b=await blob(await full(it)),base=(it.file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg',file=new File([b],base.replace('.jpg','-hassy-natural.jpg'),{type:'image/jpeg'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]})}else{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=file.name;a.click()}}else{msg('Saving batch…');for(let i=0;i<S.items.length;i++){let it=S.items[i],b=await blob(await full(it)),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(it.file.name||('photo-'+(i+1))).replace(/\.[^.]+$/,'')+'-hassy-natural.jpg';a.click();await new Promise(r=>setTimeout(r,250))}msg('Batch saved')}}catch(e){msg('Save cancelled')}}
q('camera').onchange=e=>load(e.target.files);q('library').onchange=e=>load(e.target.files);q('back').onclick=()=>{S.items=[];editor.classList.remove('active');home.classList.remove('hidden')};q('save').onclick=save;
q('intensity').oninput=e=>{S.intensity=+e.target.value;q('val').textContent=S.intensity;S.original=false;render()};q('reset').onclick=()=>{S.intensity=100;q('intensity').value=100;q('val').textContent=100;S.original=false;render()};
q('compare').onclick=()=>{S.original=!S.original;q('compare').textContent=S.original?'Show Natural':'Show original';render()};q('preview').onpointerdown=()=>{S.original=true;render()};q('preview').onpointerup=q('preview').onpointercancel=()=>{S.original=false;render()};
addEventListener('resize',()=>S.items.length&&render());if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
